name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  build-linux-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: make -j4 CC=gcc && cp build/moxy moxy
      - name: Test
        run: ./moxy --version && ./moxy test tests
      - name: Package
        run: |
          mkdir -p dist
          tar czf "dist/moxy-${{ needs.prepare.outputs.version }}-linux-amd64.tar.gz" moxy
      - uses: actions/upload-artifact@v4
        with:
          name: moxy-linux-amd64
          path: dist/

  build-linux-arm64:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: make -j4 CC=aarch64-linux-gnu-gcc AR=aarch64-linux-gnu-ar && cp build/moxy moxy
      - name: Package
        run: |
          mkdir -p dist
          tar czf "dist/moxy-${{ needs.prepare.outputs.version }}-linux-arm64.tar.gz" moxy
      - uses: actions/upload-artifact@v4
        with:
          name: moxy-linux-arm64
          path: dist/

  build-linux-static:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: make -j4 CC=musl-gcc LDFLAGS=-static && cp build/moxy moxy
      - name: Smoke test
        run: ./moxy --version
      - name: Package
        run: |
          mkdir -p dist
          tar czf "dist/moxy-${{ needs.prepare.outputs.version }}-linux-amd64-static.tar.gz" moxy
      - uses: actions/upload-artifact@v4
        with:
          name: moxy-linux-amd64-static
          path: dist/

  build-macos-amd64:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: make -j4 CFLAGS="-O2 -target x86_64-apple-macos12" LDFLAGS="-target x86_64-apple-macos12" && cp build/moxy moxy
      - name: Package
        run: |
          mkdir -p dist
          tar czf "dist/moxy-${{ needs.prepare.outputs.version }}-darwin-amd64.tar.gz" moxy
      - uses: actions/upload-artifact@v4
        with:
          name: moxy-darwin-amd64
          path: dist/

  build-macos-arm64:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: make -j4 && cp build/moxy moxy
      - name: Test
        run: ./moxy --version && ./moxy test tests
      - name: Package
        run: |
          mkdir -p dist
          tar czf "dist/moxy-${{ needs.prepare.outputs.version }}-darwin-arm64.tar.gz" moxy
      - uses: actions/upload-artifact@v4
        with:
          name: moxy-darwin-arm64
          path: dist/

  package-deb:
    needs: [prepare, build-linux-amd64, build-linux-arm64]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build-linux-amd64.result == 'success' || needs.build-linux-arm64.result == 'success') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            arch: amd64
            build: build-linux-amd64
          - target: linux-arm64
            arch: arm64
            build: build-linux-arm64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: moxy-${{ matrix.target }}
          path: dist/

      - name: Build .deb
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          PKG="moxy_${VERSION}_${ARCH}"
          mkdir -p "${PKG}/DEBIAN" "${PKG}/usr/bin"
          tar xzf "dist/moxy-${VERSION}-${TARGET}.tar.gz" -C "${PKG}/usr/bin/"
          chmod 755 "${PKG}/usr/bin/moxy"

          cat > "${PKG}/DEBIAN/control" <<CTRL
          Package: moxy
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: Wess Cope
          Homepage: https://github.com/wess/moxy
          Description: Moxy programming language
           Moxy is C with modern conveniences: strings, lists, maps, tagged enums,
           match, Result, closures and automatic reference-counted memory
           management. Compiles .mxy source files to portable C11.
          CTRL

          sed -i 's/^          //' "${PKG}/DEBIAN/control"
          dpkg-deb --build --root-owner-group "${PKG}"
          mv "${PKG}.deb" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: moxy-deb-${{ matrix.arch }}
          path: dist/*.deb

  package-rpm:
    needs: [prepare, build-linux-amd64]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build-linux-amd64.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: moxy-linux-amd64
          path: dist/

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build .rpm
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar xzf "dist/moxy-${VERSION}-linux-amd64.tar.gz"
          cp moxy rpmbuild/SOURCES/

          cat > rpmbuild/SPECS/moxy.spec <<'SPEC'
          Name:           moxy
          Version:        %{_moxy_version}
          Release:        1%{?dist}
          Summary:        Moxy programming language transpiler
          License:        MIT
          URL:            https://github.com/wess/moxy

          %description
          Moxy is C with modern conveniences: strings, lists, maps, tagged enums,
          match, Result, closures and automatic reference-counted memory
          management. Compiles .mxy source files to portable C11.

          %install
          mkdir -p %{buildroot}%{_bindir}
          install -m 755 %{_sourcedir}/moxy %{buildroot}%{_bindir}/moxy

          %files
          %{_bindir}/moxy
          SPEC

          sed -i 's/^          //' rpmbuild/SPECS/moxy.spec
          rpmbuild \
            --define "_topdir $(pwd)/rpmbuild" \
            --define "_moxy_version ${VERSION}" \
            -bb rpmbuild/SPECS/moxy.spec

          find rpmbuild/RPMS -name '*.rpm' -exec cp {} dist/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: moxy-rpm
          path: dist/*.rpm

  package-arch:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Generate PKGBUILD
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist

          cat > dist/PKGBUILD <<'EOF'
          # Maintainer: Wess Cope
          pkgname=moxy
          pkgver=_VERSION_
          pkgrel=1
          pkgdesc="Moxy programming language transpiler"
          arch=('x86_64' 'aarch64')
          url="https://github.com/wess/moxy"
          license=('MIT')
          depends=('glibc')
          makedepends=('gcc' 'git')
          source=("${url}/archive/v${pkgver}.tar.gz")
          sha256sums=('SKIP')

          _goose=ab6f2efab9e5b8af655a6bffa39017b9b1e7fda2
          source+=("goose.tar.gz::https://github.com/wess/goose/archive/${_goose}.tar.gz")
          sha256sums+=('SKIP')

          prepare() {
            cd "${pkgname}-${pkgver}"
            rm -rf libs/goose
            mv "../goose-${_goose}" libs/goose
          }

          build() {
            cd "${pkgname}-${pkgver}"
            make
          }

          package() {
            cd "${pkgname}-${pkgver}"
            install -Dm755 build/moxy "${pkgdir}/usr/bin/moxy"
          }
          EOF

          sed -i "s/_VERSION_/${VERSION}/" dist/PKGBUILD
          sed -i 's/^          //' dist/PKGBUILD

      - uses: actions/upload-artifact@v4
        with:
          name: moxy-pkgbuild
          path: dist/PKGBUILD

  installer-script:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Generate install script
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist

          cat > dist/install.sh <<'SCRIPT'
          #!/bin/sh
          set -eu

          REPO="wess/moxy"
          VERSION="_VERSION_"
          INSTALL_DIR="${INSTALL_DIR:-/usr/local/bin}"

          detect_platform() {
            OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
            ARCH="$(uname -m)"

            case "${OS}" in
              linux)  OS="linux" ;;
              darwin) OS="darwin" ;;
              *)      echo "Unsupported OS: ${OS}" >&2; exit 1 ;;
            esac

            case "${ARCH}" in
              x86_64|amd64)   ARCH="amd64" ;;
              aarch64|arm64)  ARCH="arm64" ;;
              *)              echo "Unsupported architecture: ${ARCH}" >&2; exit 1 ;;
            esac

            # prefer static build on linux
            SUFFIX=""
            if [ "${OS}" = "linux" ] && [ "${ARCH}" = "amd64" ]; then
              SUFFIX="-static"
            fi

            echo "${OS}-${ARCH}${SUFFIX}"
          }

          PLATFORM="$(detect_platform)"
          TARBALL="moxy-${VERSION}-${PLATFORM}.tar.gz"
          URL="https://github.com/${REPO}/releases/download/v${VERSION}/${TARBALL}"

          TMPDIR="$(mktemp -d)"
          trap 'rm -rf "${TMPDIR}"' EXIT

          echo "Downloading moxy v${VERSION} for ${PLATFORM}..."
          if command -v curl >/dev/null 2>&1; then
            curl -fsSL "${URL}" -o "${TMPDIR}/${TARBALL}"
          elif command -v wget >/dev/null 2>&1; then
            wget -q "${URL}" -O "${TMPDIR}/${TARBALL}"
          else
            echo "Error: curl or wget required" >&2
            exit 1
          fi

          tar xzf "${TMPDIR}/${TARBALL}" -C "${TMPDIR}"

          if [ -w "${INSTALL_DIR}" ]; then
            cp "${TMPDIR}/moxy" "${INSTALL_DIR}/moxy"
          else
            echo "Installing to ${INSTALL_DIR} (requires sudo)..."
            sudo cp "${TMPDIR}/moxy" "${INSTALL_DIR}/moxy"
          fi

          chmod +x "${INSTALL_DIR}/moxy"
          echo "moxy v${VERSION} installed to ${INSTALL_DIR}/moxy"
          SCRIPT

          sed -i "s/_VERSION_/${VERSION}/g" dist/install.sh
          chmod +x dist/install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: moxy-installer
          path: dist/install.sh

  release:
    needs: [prepare, build-linux-amd64, build-linux-arm64, build-linux-static, build-macos-amd64, build-macos-arm64, package-deb, package-rpm, package-arch, installer-script]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.create.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name '*.tar.gz' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name 'PKGBUILD' -o \
            -name 'install.sh' \
          \) -exec cp {} release/ \;
          echo "Release assets:"
          ls -lh release/

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > checksums.txt

      - name: Create release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "Moxy v${VERSION}" \
            --generate-notes \
            release/*

  update-homebrew:
    needs: [prepare, release]
    if: ${{ needs.release.outputs.released }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Homebrew formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          TARBALL_URL="https://github.com/wess/moxy/archive/refs/tags/v${VERSION}.tar.gz"
          SHA256=$(curl -fsSL "${TARBALL_URL}" | sha256sum | awk '{print $1}')

          # only the first url/sha256 belong to moxy; the goose resource is pinned separately
          sed -i "0,/^  url \".*\"/s||  url \"${TARBALL_URL}\"|" Formula/moxy.rb
          sed -i "0,/^  sha256 \".*\"/s||  sha256 \"${SHA256}\"|" Formula/moxy.rb

      - name: Commit updated formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/moxy.rb
          git diff --cached --quiet && exit 0
          git commit -m "Update Homebrew formula to v$(tr -d '[:space:]' < VERSION)"
          git push
